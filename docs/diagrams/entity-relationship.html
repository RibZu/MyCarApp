<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCarApp · Modelo entidad-relación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · MyCarApp</p>
    <h1>Usuarios, vehículos y alquileres en MyCarApp</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">MyCarApp · modelo entidad-relación</title>
      <desc id="er-desc">Diagrama entidad-relación que muestra usuarios y vehículos relacionados a través de alquileres, con sus campos, clave primaria y claves foráneas.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Relationship lines (drawn first) -->
      <!-- USUARIOS — ALQUILERES (1 : 0..N, "realiza") -->
      <line x1="280" y1="260" x2="360" y2="260" stroke="#4f5d75" stroke-width="1"/>
      <!-- VEHICULOS — ALQUILERES (1 : 0..N, "reserva") -->
      <line x1="600" y1="260" x2="680" y2="260" stroke="#4f5d75" stroke-width="1"/>

      <!-- Cardinality labels -->
      <rect x="286" y="254" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="263" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="326" y="254" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="263" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..N</text>

      <rect x="606" y="254" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="263" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..N</text>

      <rect x="662" y="254" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="263" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <!-- Relationship verb labels -->
      <rect x="288" y="238" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="320" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">REALIZA</text>

      <rect x="608" y="238" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="640" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">RESERVA</text>

      <!-- Entity: USUARIOS -->
      <rect x="40" y="140" width="240" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="140" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="40" y="172" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="180" x2="280" y2="180" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="56" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="56" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Usuarios</text>
      <text x="56" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="240" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="56" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">nombre_apellido</text>
      <text x="240" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="56" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">direccion</text>
      <text x="240" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="56" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">telefono</text>
      <text x="240" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="56" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">email</text>
      <text x="240" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string · UK</text>
      <text x="56" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">password</text>
      <text x="240" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="56" y="320" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">rol</text>
      <text x="240" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
      <text x="56" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_alta</text>
      <text x="240" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">date</text>

      <text x="240" y="360" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">boolean</text>

      <!-- Entity: ALQUILERES (focal / central) -->
      <rect x="360" y="160" width="240" height="200" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="360" y="160" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
      <rect x="360" y="192" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
      <line x1="360" y1="200" x2="600" y2="200" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
      <text x="376" y="176" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · CENTRAL</text>
      <text x="376" y="192" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Alquileres</text>
      <text x="376" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="560" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="376" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ vehiculo_id</text>
      <text x="560" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="376" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ usuario_id</text>
      <text x="560" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="376" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_desde</text>
      <text x="560" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">date</text>
      <text x="376" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">cantidad_dias</text>
      <text x="560" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="376" y="320" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_hasta</text>
      <text x="560" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">date</text>
      <text x="376" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">estado</text>
      <text x="560" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

      <!-- Entity: VEHICULOS -->
      <rect x="680" y="120" width="240" height="280" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="120" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="680" y="152" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="680" y1="160" x2="920" y2="160" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="696" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="696" y="152" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Vehiculos</text>
      <text x="696" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="880" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="696" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">marca</text>
      <text x="880" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="696" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">modelo</text>
      <text x="880" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="696" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">anio</text>
      <text x="880" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="696" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">imagen</text>
      <text x="880" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="696" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">numero_plazas</text>
      <text x="880" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="696" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">motor</text>
      <text x="880" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
      <text x="696" y="320" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">kilometraje</text>
      <text x="880" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="696" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">precio_dia</text>
      <text x="880" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">decimal</text>
      <text x="696" y="360" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">estado_alquiler</text>
      <text x="880" y="360" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
      <text x="696" y="380" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">activo</text>
      <text x="880" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">boolean</text>

      <!-- Legend -->
      <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="452" width="14" height="10" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entidad central</text>

      <rect x="210" y="452" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="230" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entidad</text>

      <text x="340" y="460" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
      <text x="356" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clave primaria</text>

      <text x="480" y="460" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
      <text x="496" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clave foránea</text>

      <text x="620" y="460" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1 / 0..N</text>
      <text x="672" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cardinalidad</text>
    </svg>
  </div>
</body>
</html>
