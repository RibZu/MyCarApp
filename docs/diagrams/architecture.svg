<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">MyCarApp · arquitectura CodeIgniter 4 MVC</title>
      <desc id="architecture-desc">Diagrama de arquitectura que muestra cómo una petición del navegador atraviesa las rutas, controladores y modelos de CodeIgniter 4 hasta MySQL, con validación de sesión y una respuesta renderizada de vuelta a la vista.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: CodeIgniter 4 · MVC (drawn before arrows and nodes) -->
      <rect x="356" y="112" width="488" height="288" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="530" y="116" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="125" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CODEIGNITER 4 · MVC</text>

      <!-- Arrows (behind nodes) -->
      <!-- UI -> Routes (HTTP entry, link-blue) -->
      <line x1="480" y1="104" x2="480" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Routes -> Controladores (primary flow, accent) -->
      <line x1="480" y1="200" x2="480" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Controladores -> Modelos -->
      <line x1="480" y1="288" x2="480" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Modelos -> DB -->
      <line x1="480" y1="376" x2="480" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Controladores -.-> Session (dashed, valida rol) -->
      <line x1="580" y1="256" x2="660" y2="256" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Controladores -.-> UI (dashed return, render — bypasses Routes on the left) -->
      <path d="M 380,256 H 340 Q 332,256 332,248 V 76 Q 332,68 340,68 H 380"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="490" y="112" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="508" y="124" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <rect x="588" y="236" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="620" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDA ROL</text>

      <rect x="254" y="154" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="288" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

      <!-- Node: Navegador (Input/User) -->
      <rect x="380" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="40" width="200" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="388" y="48" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="402" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="480" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Navegador</text>

      <!-- Node: Routes.php (Backend/Step) -->
      <rect x="380" y="144" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="144" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="152" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="402" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTR</text>
      <text x="480" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Routes.php</text>
      <text x="480" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enrutador CI4</text>

      <!-- Node: Controladores (Focal) -->
      <rect x="380" y="224" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="224" width="200" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="232" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="402" y="241" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
      <text x="480" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controladores</text>
      <text x="480" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 controladores</text>

      <!-- Node: Sesión PHP (Store/State) -->
      <rect x="660" y="228" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="228" width="160" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="668" y="236" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="682" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESS</text>
      <text x="740" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sesión PHP</text>
      <text x="740" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rol · usuario_id</text>

      <!-- Node: Modelos (Backend/Step) -->
      <rect x="380" y="312" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="312" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="320" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="402" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOD</text>
      <text x="480" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modelos</text>

      <!-- Node: MySQL (Store/State) -->
      <rect x="380" y="432" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="432" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="388" y="440" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="402" y="449" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="480" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MySQL</text>
      <text x="480" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 tablas MySQL</text>

      <!-- Legend strip -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="548" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Controladores</text>

      <rect x="170" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="190" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Rutas · modelos</text>

      <rect x="310" y="548" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="330" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sesión · BD</text>

      <rect x="420" y="548" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="440" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Navegador</text>

      <line x1="520" y1="553" x2="548" y2="553" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="556" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Petición HTTP</text>

      <line x1="660" y1="553" x2="688" y2="553" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="696" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo principal</text>

      <line x1="810" y1="553" x2="838" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="846" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retorno</text>
    </svg>